name: flutter_bizpage
description: Flutter BizPage
publish_to: none
version: 0.0.13

environment:
  sdk: ^3.10.0
  flutter: ^3.38.0

dependencies:
  flutter:
    sdk: flutter

  async: ^2.13.0
  provider: ^6.1.5+1
  device_info_plus: ^12.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.10.5
  build_version: ^2.1.3
  test: ^1.28.0
  very_good_analysis: ^10.0.0

flutter:
  assets:
    - google_fonts/
    - images/
  fonts:
    - family: OpenSans
      fonts:
        - asset: google_fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: google_fonts/OpenSans-Regular.ttf
          weight: 400
    - family: Roboto
      fonts:
        - asset: google_fonts/Roboto-Regular.ttf

  uses-material-design: true
